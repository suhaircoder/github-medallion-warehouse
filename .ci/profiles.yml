github_medallion_warehouse:
  target: ci
  outputs:
    ci:
      type: bigquery
      method: service-account-json
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: github_medallion_ci
      location: US
      threads: 4
      keyfile_json: "{{ fromjson(env_var('GCP_SERVICE_ACCOUNT_JSON')) }}"
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive
